# Action Cable uses the Redis add-on as its message bus (SUBSCRIBE / PUBLISH).
# Every broadcast goes to the channel "neon_arcade:arcade".
development:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/1") %>
  channel_prefix: neon_arcade

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV["REDIS_URL"] %>
  channel_prefix: neon_arcade
